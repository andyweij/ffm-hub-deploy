termsDecline=離開此頁面
termsContent=<div class="card-body"><!--<small class="align-items-end">台灣智慧雲端服務有限公司 AFS AI Hub 使用條款 v20250620</small>--><h4 class="card-title mb-3 text-center">AFS AI Hub Beta 使用條款</h4><h5 class="card-subtitle text-center fw-bold mb-4">AFS AI Hub Terms of Use</h5><p class="fw-bold mb-2">前言</p><p class="mb-3 text-justify terms-content">本條條款適用於 AFS AI Hub Beta 版服務，旨在收集使用者回饋、進行功能驗證與錯誤修正。用戶理解並同意，測試版服務可能存在未知的錯誤、不穩定性、效能問題或功能限制，且本公司不保證其服務的持續性與穩定性。</p><p class="mb-4 text-justify terms-content">AFS AI Hub 使用條款（以下簡稱「本條款」）為台灣雲端服務股份有限公司（以下簡稱「本公司」）與用戶、試用者（以下簡稱「用戶」）間所約定之契約。除另有約定外，本使用條款與服務契約之內容如有不一致之處，以本使用條款優先適用。本公司將於交付AFS AI Hub 安裝檔案時，一併提供本使用條款的最新版本，雙方權利義務應適用當時的最新版本。</p><p class="fw-bold mb-2">一、定義：</p><ol class="mb-4 terms-content"><li>「雙方約定條款」是指本公司與用戶之間，現有及未來之所有經過雙方簽署同意或經本公司提出後經用戶明示及默示同意之約定條款，包括但不限於本使用條款、服務契約、會員條款、個人資料蒐集同意書、本公司平台服務條款、隱私權及資訊安全政策，以及適用之服務申請書等。</li><li>「AFS AI Hub」是指本公司所開發之模型部署推論平台，可於AFS AI Hub部署之大語言模型包含但不限於福爾摩沙基礎模型(FFM)、開源模型、私人微調模型。</li><li>「本公司財產」是指本公司所擁有之財產，包括但不限於本公司之產品及服務。</li><li>「第三方服務提供商財產」是指第三方服務提供商所擁有之財產，包括但不限於第三方服務提供商之產品及服務。</li><li>「人工智慧模型」是指符合一般通俗認知，由機器學習方法建立之數學模型、參數、參數權重值所組成的電腦程式組合與實作（implementations），及其衍生物，包括但不限於模型、程式碼、電腦機械碼、參數、權重值的修改與改作品。</li><li>「福爾摩沙基礎模型」是指由本公司所研發或訓練開源模型之衍生改作之各式人工智慧模型，應用領域包括但不限於文字、語音、電腦影像等。</li><li>「用戶輸入資料」是指用戶為使用福爾摩沙基礎模型進行推論時所輸入至AFS AI Hub之各類資料。</li><li>「用戶輸出資料」是指用戶將資料輸入至AFS AI Hub並以福爾摩沙基礎模型進行推論後，所得之輸出資料。</li><li>「附帶軟體」是指本公司為使用戶能有合適的介面與福爾摩沙基礎模型互動所提供之各式軟體，包含但不限於開源軟體或本公司自行開發之非開源軟體。</li><li>「適用法律」是指本公司依雙方約定條款，向用戶提供之服務、商品所在國家及管轄區之法律、政府主管機關、行政機關或管理機關所訂之相關法規、規則及準則。</li></ol><p class="fw-bold mb-2">二、 AFS AI Hub、福爾摩沙基礎模型提供及使用：</p><ol class="mb-4 terms-content"><li>AFS AI Hub 與福爾摩沙基礎模型提供範圍：AFS AI Hub規格與所提供之福爾摩沙基礎模型清單，以本公司使用說明內容為準。</li><li>AFS AI Hub 提供方式：本公司得以電子檔案形式或透過其他方式提供AFS AI Hub以及相關文件。</li><li>第三方內容：本公司之模型與軟體可能包括來自第三方的資料及軟體，第三方內容提供者可能不時更改附加條款，亦可能加入新第三方內容。</li><li>使用 AFS AI Hub 與福爾摩沙基礎模型要求：當用戶使用AFS AI Hub與福爾摩沙基礎模型時符合以下要求：<br>a.依據雙方約定條款、使用說明和操作規範適當使用AFS AI Hub與福爾摩沙基礎模型。<br>b.視需要自行實施及維護適當充分之病毒或惡意軟體防護措施及備份與恢復系統。<br>c.除 AFS AI Hub 與福爾摩沙基礎模型無法正常運作之問題外，用戶不得要求本公司無償進行軟體更新與維護。</li><li>AFS AI Hub與福爾摩沙基礎模型使用權：用戶於雙方約定條款之範圍內，有以下對AFS AI Hub與福爾摩沙基礎模型使用之權利：<br>a.測試使用權：本公司依雙方約定條款授予客用戶僅為測試使用AFS AI Hub與福爾摩沙基礎模型的非專屬、不可轉授權且不可轉讓之權利。<br>b.軟體安裝權：於用戶依雙方約定條款對本公司的任何軟體免費試用之情況下，本公司授予用戶僅為測試目的而安裝和使用該等軟體之非專屬、不可轉授權且不可轉讓之權利。該等軟體之任何副本仍屬本公司財產，受雙方約定條款拘束，並必須包括原件中載有的所有版權或其他專有權利聲明。<br></li><li>使用限制：用戶不得使用本公司財產或AFS AI Hub與福爾摩沙基礎模型，逾越雙方約定條款中授予使用權限之目的。除本使用條款中另有明確允許之外，用戶不得自己或允許第三方：<br>a.未經授權，嚴禁對 AFS AI Hub Beta 版或福爾摩沙基礎模型進行以下行為：出售、授權、轉授權、散布、傳輸、發表、展示、儲存、複製與修改，或將其作為任何其他產品、服務或材料的組成部分。<br>b.AFS AI Hub Beta 版僅供測試與評估目的使用，嚴禁將其用於任何商業用途或營利活動。如用戶違反本條款，本公司有權向用戶收取商業營利的費用。<br>c.由於 AFS AI Hub Beta 為測試版本，其輸出資料的準確性及完整性無法保證，用戶應自行判斷並承擔使用該輸出資料的風險。未經本公司書面同意，用戶不得將 Beta 測試版產生的輸出資料用於公開發表或任何商業目的。<br>d.對本公司財產、AFS AI Hub與福爾摩沙基礎模型進行反編譯、解析、逆向編譯、逆向工程或其他類似行為。<br>e.使用本公司財產、AFS AI Hub與福爾摩沙基礎模型訓練任何人工智慧或機器學習算法或軟體，或創建任何衍生物。<br>f.讓未經本公司同意使用之第三方訪問或使用本公司財產、AFS AI Hub與福爾摩沙基礎模型。<br>g.以任何方式或出於任何目的侵犯、濫用或以其他方式妨礙他人的任何智慧財產權或其他權利，或違反任何適用法律。</li><li>用戶資料提供：用戶確認並保證其對所提供之所有資料（包括但不限於於使用 AFS AI Hub 測試語言模型時所輸入之資料）擁有合法的提供權限，且該等資料之提供與使用不會侵犯任何第三方之智慧財產權、商業機密、個人資料或其他法律權益。用戶應自行承擔因其提供或使用該等資料所引起之任何法律爭議或第三方主張，並同意本公司對因此產生之任何責任或損害不負任何責任。</li><li>服務提供關係：本公司與用戶係各自獨立之權利主體。除按本條款發生之權利義務關係外，雙方及其各自之員工、經理人、董事、代表、分包商，皆無權互為代理人或發生僱傭關係、委任關係、合夥關係或其他類似之合作關係。</li><li>不提供建議：AFS AI Hub與福爾摩沙基礎模型非提供財務、稅務、會計、法律或任何其他專業之建議，用戶以輸出資料而做出的任何解讀或決定均由用戶承擔全部責任。用戶同意因於前述方面使用AFS AI Hub與福爾摩沙基礎模型而製作或產生之任何文件、數據、內容、決定或採取的行動，均由用戶自行負責。</li></ol><p class="fw-bold mb-2">三、 智慧財產權：</p><ol class="mb-4 terms-content"><li>權利保留：本公司與用戶於簽訂本條款及由本公司提供AFS AI Hub與福爾摩沙基礎模型前，既有之技術、資料及其可能產生之專利權、著作權、營業秘密及其他智慧財產權，各歸其原所有人。本公司及用戶各自保有雙方約定條款中未明確授予他方之所有權利。除雙方約定條款中明確授予之權利外，無任何條款以暗示、豁免、禁反言或其他方式，授予他方任何智慧財產權之所有權、授權或其他權利。</li><li>權利所有：用戶明確了解並同意，除用戶輸出之資料外，於適用法律允許範圍內，本公司於開發AFS AI Hub與福爾摩沙基礎模型過程中所構想、發現、施行、研發、製造、產生之任何數據、資料、電腦程式、模型、權重值、技術、發明、設計、新型或其他智慧財產權皆歸屬本公司所有。</li></ol><p class="fw-bold mb-2">四、 保密：</p><ol class="mb-4 terms-content"><li>保密資訊：指用戶揭露、傳輸予本公司財產或模型之用戶輸入資料，以及本公司與用戶間之雙方約定條款及本公司為提供AFS AI Hub與福爾摩沙基礎模型所揭露、傳輸至用戶之資訊。保密資訊不包括下列資訊：<br>a.依雙方約定條款規定揭露予收受方時為大眾一般可得之資訊。<br>b.揭露後經由收受方違反雙方約定條款之作為或不作為以外之方式成為大眾一般可得之資訊。<br>c.事後經揭露方以外且不具保密義務之人以合法方式獨自向收受方揭露之資訊。</li><li>保密義務：保密資訊之收受方應對保密資訊加以保密，不得向第三人揭露，亦不得按本條款以外之目的利用。本公司及用戶對保密資訊應採至少與其保護其具有相同重要性之保密資訊相同之程序及注意程度，不得低於合理注意程度。如保密資訊之收受方收受之保密資訊遭擅用或遭揭露，該方應立即以書面通知他方，並協助他方就該擅用及揭露提出補救。</li><li>強制揭露：如保密資訊之收受方或其關係企業或代表依適用法律規定或行政主管機關、法院或其他具管轄權之政府機構要求（包括口頭詢問、法律程序之資料或文件要求、傳票、民事調查要求或其他類似程序）須揭露他方之保密資訊，收受方應按相關法律准許之範圍充分及時以書面將該要求或規定告知他方，俾使他方有足夠時間聲請保護令或其他適當救濟及放棄遵守本條款規定。</li><li>第三人契約：保密資訊之收受方向第三人揭露他方之保密資訊前，於適用法律准許之範圍內，須要求該第三人簽署他方提供之保密契約。</li><li>資訊所有權： 經本公司及用戶同意，其收受之所有保密資訊現在及將來皆屬保密資訊 之揭露方財產，未經揭露方明確准許，不得複製或重製，但為達雙方約定條款意旨及提供AFS AI Hub與福爾摩沙基礎模型所合理必要之範圍內，不在此限。經保密資訊揭露方書面要求後，他方應立即停止利用揭露方之所有保密資訊，並依揭露方之選擇將其持有之紙本及電子形式之保密資訊及其任何衍生作品（包括所有紙本譯本、修訂本、匯編、節本或保密資訊之其他改寫、改變或改編本）全部予以銷毀或歸還揭露方，並刪除其所有線上電子本，惟收受方得保留存檔用副本一份，僅供雙方約定條款發生爭議時使用。</li><li>保密義務之持續效力：本條款於測試期間屆期或終止後仍為有效，雙方應遵守本條款之保密義務，至服務終止後五年或保密資訊非因收受方之作為或不作為而公開或已屬一般大眾可得而知之資訊時（以較短者為準）。</li></ol><p class="fw-bold mb-2">五、 聲明及保證：</p><ol class="mb-4 terms-content"><li>除雙方約定條款已明確約定外，本公司於適用法律允許之範圍內，對AFS AI Hub與福爾摩沙基礎模型不提供任何明示、默示、法定或其他任何形式之保證，包括但不限於對AFS AI Hub與福爾摩沙基礎模型之品質、正確性、準確性、持續及穩定提供或適於特定目的保證。</li></ol><p class="fw-bold mb-2">六、 本公司責任及責任限制：</p><ol class="mb-4 terms-content"><li>AFS AI Hub與福爾摩沙基礎模型提供標準：本公司提供AFS AI Hub與福爾摩沙基礎模型時，應克盡職責並遵守辦理全部或部分服務之適用法律。除於雙方約定條款特別指明外，本公司提供之AFS AI Hub與福爾摩沙基礎模型依其原樣提供。</li><li>責任免除：在任何情況下，本公司均不對用戶就用戶因本公司依本條款提供服務所受之任何損害或損失負賠償責任，但若該損害或損失係因本公司的重大過失或故意行為所致者，則不在此限。</li><li>責任限制：本公司就提供AFS AI Hub與福爾摩沙基礎模型之責任皆不超出用戶於試用期間須承擔之時間與金錢上的成本，但本公司因故意或過失違反適用法律所生之損害，則不在此限。此責任限制適用於任何本公司因本條款所生或與本條款有關而應負之責任總和，包括但不限於違反本條款、違反聲明或保證、因故意或過失、無過失責任或侵權行為所致生之責任。</li><li>用戶明確理解並同意，由於 AFS AI Hub 為 Beta 版本，本公司不保證其功能穩定、無錯誤或不中斷，亦不保證其輸出資料的正確性、準確性或適用於特定目的。用戶使用AFS AI Hub Beta 版服務應自行承擔所有風險。</li></ol><p class="fw-bold mb-2">七、 試用期間與終止：</p><ol class="mb-4 terms-content"><li>試用期間：試用期間如雙方約定條款所載。</li><li>暫停或終止試用：於以下情況，本公司得以暫停或終止試用：<br>a.基於行政主管機關、法院或其他具管轄權之政府機構之要求。<br>b.用戶違反雙方約定條款。<br>c.用戶使用AFS AI Hub與福爾摩沙基礎模型侵犯第三方權利或違反適用法律。<br>本公司之通知將指明暫停或終止試用之原因，若該原因能夠被合理補救，本公司將告知用戶必須採取之措施以恢復使用。若用戶在收受暫停或終止試用通知後七天內未能補救原因，本公司得再發出終止試用通知，試用終止後用戶不得要求任何對於AFS AI Hub與福爾摩沙基礎模型的服務。</li><li>終止效力：除非本公司與用戶另行約定，否則試用屆期或試用終止後，本條款中授予的所有權利應立即終止。此外，在屆期或終止後，依照用戶之請求，本公司將視情況退回或銷毀用戶之保密資訊，若適用法律有其他之要求除外。試用屆期或終止不會影響其他已產生之權利和義務或本條款中因其性質或明確規定在終止後繼續有效之部分。</li></ol><p class="fw-bold mb-2">八、 賠償：</p><ol class="mb-4 terms-content"><li>損害賠償之避免：本公司與用戶應確保他方不因以下情形承擔任何責任、損失、損害或支出（包括合理之律師費用及成本）：<br>a.因履行雙方約定條款之故意或過失行為或不作為。<br>b.不實陳述或違反本條款之規定。<br>c.因持有或使用他方提供之資料或交付之物品而導致之專利侵權、著作權侵權、商標侵權、營業秘密侵權、個人資料侵權、所有權爭議或侵占爭議，但如用戶發生之爭議係因用戶輸入之資料所致者，本公司不負責任。本條款於試用期間屆期或終止後仍為有效。</li><li>損害賠償：用戶應確保本公司免於因用戶使用AFS AI Hub與福爾摩沙基礎模型違反本條款或違反適用法律，而引起或與之相關的任何責任、損失、損害或支出（包括合理之律師費用及成本），否則本公司得向用戶請求賠償。</li></ol><p class="fw-bold mb-2">九、 一般條款：</p><ol class="mb-4 terms-content"><li>契約之可分性：如本條款之任一條款出於任何原因被認定為無效、不合法或不具執行力即不影響亦不損及本條款其餘條款的有效性、合法性和可執行性；且應盡可能在最大限度內，將本條款規定解釋為得使該被認定為無效、不合法或不具執行力的條款所體現之真意發生效力。</li><li>修訂：如本公司與用戶以書面合意認定，為促進雙方約定條款目的、澄清雙方意旨或追加或修改本條款所載承諾、條款或條件，任何額外書面協議、章節或證明屬必要、適當或適宜者，本條款得以該等額外書面協議、章節或證明予以修訂或補充。</li><li>轉讓：本公司與用戶雙方未經他方事先以書面同意前，皆不得轉讓本條款下之權利或責任，違反此條款之轉讓概屬無效。</li><li>不可抗力：本公司與用戶雙方如基於其合理控制範圍以外之原因，包括天災、戰爭、暴動、全國性產業罷工、火災、地震、暴風或傳染病，致未予或遲延履行其於本條款下之義務，就其未予或延遲履行之期間及範圍，對他方概不負責，但受不可抗力影響之一方應即時以書面通知他方遲延或未能履約之原因。如不可抗力事件持續影響一方超過一年，他方得終止本條款，自其發出書面通知之時起生效。</li><li>通知：本公司依本條款所為之通知將依用戶試用時留存之聯絡資訊及雙方約定條款方式辦理。</li><li>準據法：雙方當事人均同意本條款之適用與解釋悉依中華民國法律規定。</li><li>爭端解決：雙方當事人應先致力以友好協商之方式，解決與本條款有關或因本條款而生之歧見或爭端。倘如雙方無法就該歧見或爭端達成共識，則雙方應由其有權處理相關爭端之代表進行協商，以善意解決與本條款有關之爭議或索求。若爭端無法於三十個日曆日內善意解決，則該爭端應提送臺灣臺北地方法院並以其為專屬管轄法院。</li></ol><p class="fw-bold mb-2">十、用戶回饋與數據使用</p><ol class="mb-4 terms-content"><li>為改進 AFS AI Hub 效能與功能，本公司得收集、儲存、分析用戶輸入資料及用戶輸出資料。本公司將採取合理措施對該等資料進行匿名化處理，並確保不會識別出特定用戶身分。用戶同意本公司得將匿名化後的資料用於產品開發、優化，且不需徵得用戶個別同意。</li></ol></div>

