services:
  aiportal:
    image: 202.5.253.162:443/ffm-hub/aiportal:1.0.7
    container_name: aiportal
    ports:
      - "443:8443"
    volumes:
      - ./certs/aiportal/keystore.p12:/app/certs/keystore.p12
      - ./certs/api-relay/certificate.crt:/app/certs/certificate.crt
    environment:
      - SPRING_PROFILES_ACTIVE=stage
      - APIMODULE_URL=https://${VM_IP}:8080
      - FRONTEND_KEYCLOAK_URL=https://${VM_IP}:8443
      - FRONTEND_KEYCLOAK_REALM=ffm-realm
      - FRONTEND_KEYCLOAK_CLIENTID=ffm
      - SERVER_PORT=8443
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_KEYSTORE=/app/certs/keystore.p12
      - SERVER_SSL_KEYSTORE_PASSWORD=changeit
      - SERVER_SSL_KEYSTORE_TYPE=PKCS12
    command: >
      sh -c "keytool -delete -alias api-relay -keystore /opt/java/openjdk/lib/security/cacerts -storepass changeit || true &&
             keytool -importcert -trustcacerts -noprompt -alias api-relay -file /app/certs/certificate.crt -keystore /opt/java/openjdk/lib/security/cacerts -storepass changeit &&
             java -jar app.jar"
    networks:
      - ffm-hub-network
  api-relay:
    image: 202.5.253.162:443/ffm-hub/api-relay:0.0.20
    container_name: api-relay
    ports:
      - "8080:8443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/${MODEL_DIR}:/opt/${MODEL_DIR}
      - ./certs/api-relay/keystore.p12:/app/certs/keystore.p12
      - ./certs/keycloak/certificate.crt:/app/certs/certificate.crt
    environment:
      - KEYCLOAK_SERVER_URL=https://${VM_IP}:8443
      - VLLM_HOST=${VM_IP}
      - SERVER_PORT=8443
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_KEYSTORE=/app/certs/keystore.p12
      - SERVER_SSL_KEYSTORE_PASSWORD=changeit
      - SERVER_SSL_KEYSTORE_TYPE=PKCS12
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_END_POINT=${S3_END_POINT}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_PREFIX=${S3_PREFIX}
      - KEYCLOAK_USERNAME=${NEW_USER}
      - KEYCLOAK_PASSWORD=${NEW_USER_PASSWORD}
      - MODEL_DIR=${MODEL_DIR}
      - MODEL_LIST=${MODEL_LIST}
    command: >
      sh -c "keytool -delete -alias keycloak -keystore /opt/java/openjdk/lib/security/cacerts -storepass changeit || true &&
             keytool -importcert -trustcacerts -noprompt -alias keycloak -file /app/certs/certificate.crt -keystore /opt/java/openjdk/lib/security/cacerts -storepass changeit &&
             java -jar app.jar"
    networks:
      - ffm-hub-network
  postgres:
    image: postgres:latest
    container_name: ffm-hub-db
    volumes:
      - keycloak_db:/var/lib/postgresql/data
      - ./config/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql
    expose:
      - 5432
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    networks:
      - ffm-hub-network
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.0
    container_name: keycloak
    ports:
      - "8443:8443"
      - "9000:9000"
    volumes:
      - ./certs/keycloak/certificate.crt:/opt/keycloak/conf/keycloak.crt
      - ./certs/keycloak/private.key:/opt/keycloak/conf/keycloak.key
      - ./config/ffm-hub.json:/opt/keycloak/data/import/ffm-hub.json
      - ./keycloak_theme:/opt/keycloak/themes
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTPS_ENABLED=true
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/conf/keycloak.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/conf/keycloak.key
      - KC_HEALTH_ENABLED=true
      - KC_DB=postgres
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
    command: start-dev --import-realm
    networks:
      - ffm-hub-network
  prometheus:
    image: prom/prometheus:latest
    container_name: ffm-hub-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"     # allow a direct connection from container to the local machine
    ports:
      - "9090:9090"   # the default port used by Prometheus
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml # mount Prometheus config file
      - prometheus_data:/prometheus
    networks:
      - ffm-hub-network
  grafana:
    image: grafana/grafana:latest
    container_name: ffm-hub-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./config/grafana/dashboards:/etc/grafana/dashboards
      - ./config/grafana/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    networks:
      - ffm-hub-network
volumes:
  keycloak_db:
  prometheus_data:
  
networks:
  ffm-hub-network:
    name: ffm-hub-network
    driver: bridge